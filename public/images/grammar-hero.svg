<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0012"/>
      <stop offset="50%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#2d000b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="gHeroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#gHeroBg)" rx="16"/>

  <!-- Subtle Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <pattern id="gHeroGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#gHeroGrid)"/>
  </g>

  <!-- Ambient Orbs -->
  <circle cx="200" cy="100" r="140" fill="#eab308" opacity="0.15" filter="url(#gHeroGlow)"/>
  <circle cx="1000" cy="300" r="160" fill="#a855f7" opacity="0.15" filter="url(#gHeroGlow)"/>

  <!-- Open Book & Fountain Pen Artwork Left Side -->
  <g transform="translate(140, 90)" filter="url(#gHeroGlow)">
    <!-- Book Shadow -->
    <ellipse cx="120" cy="180" rx="140" ry="18" fill="#000000" opacity="0.5"/>

    <!-- Left Book Cover & Pages -->
    <path d="M 0 160 C 45 150 95 162 120 170 L 120 20 C 95 10 45 -5 0 5 Z" fill="#78350f"/>
    <path d="M 8 152 C 50 144 96 154 118 162 L 118 24 C 96 16 50 4 8 12 Z" fill="#fef3c7"/>
    <path d="M 12 148 C 52 140 97 150 116 158 L 116 26 C 97 18 52 6 12 14 Z" fill="#fffbeb"/>

    <!-- Right Book Cover & Pages -->
    <path d="M 240 160 C 195 150 145 162 120 170 L 120 20 C 145 10 195 -5 240 5 Z" fill="#78350f"/>
    <path d="M 232 152 C 190 144 144 154 122 162 L 122 24 C 144 16 190 4 232 12 Z" fill="#fef3c7"/>
    <path d="M 228 148 C 188 140 143 150 124 158 L 124 26 C 143 18 188 6 228 14 Z" fill="#fffbeb"/>

    <!-- Spine -->
    <line x1="120" y1="20" x2="120" y2="168" stroke="#ca8a04" stroke-width="3"/>

    <!-- Page Rule Lines -->
    <g stroke="#92400e" stroke-width="2" stroke-linecap="round" opacity="0.5">
      <line x1="30" y1="45" x2="100" y2="40"/>
      <line x1="30" y1="65" x2="100" y2="60"/>
      <line x1="30" y1="85" x2="100" y2="80"/>
      <line x1="30" y1="105" x2="100" y2="100"/>
      <line x1="30" y1="125" x2="100" y2="120"/>

      <line x1="140" y1="40" x2="210" y2="45"/>
      <line x1="140" y1="60" x2="210" y2="65"/>
      <line x1="140" y1="80" x2="210" y2="85"/>
      <line x1="140" y1="100" x2="210" y2="105"/>
      <line x1="140" y1="120" x2="210" y2="125"/>
    </g>

    <!-- Golden Feather Quill Pen -->
    <path d="M 190 -30 Q 230 40 120 150 Q 150 60 190 -30 Z" fill="url(#goldGrad)"/>
    <line x1="190" y1="-30" x2="120" y2="150" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- Right Side Header Content -->
  <g transform="translate(480, 130)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#fde047" opacity="0.9"/>
    <text x="90" y="21" fill="#4a0012" font-family="Georgia, serif" font-weight="bold" font-size="14" text-anchor="middle">
      MODULE A • 3 VOLUMES
    </text>

    <!-- Title -->
    <text x="0" y="75" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="34" filter="url(#gHeroGlow)">
      Modern English Grammar
    </text>
    <text x="0" y="115" fill="#fde047" font-family="Georgia, serif" font-weight="bold" font-size="28">
      &amp; Composition Reader
    </text>

    <!-- Subtitle -->
    <text x="0" y="155" fill="#fef3c7" font-family="Georgia, serif" font-style="italic" font-size="16">
      Comprehensive volume readers, structured chapters &amp; self-testing exercises.
    </text>
  </g>
</svg>

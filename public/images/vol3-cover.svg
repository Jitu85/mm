<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="v3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="v3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="v3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#v3Bg)"/>
  <rect x="12" y="12" width="376" height="216" rx="12" fill="none" stroke="url(#v3Gold)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Volume Badge Icon -->
  <g transform="translate(40, 45)" filter="url(#v3Shadow)">
    <circle cx="45" cy="45" r="40" fill="url(#v3Gold)"/>
    <text x="45" y="58" fill="#1e1b4b" font-family="Georgia, serif" font-weight="bold" font-size="34" text-anchor="middle">III</text>
  </g>

  <!-- Text Details -->
  <g transform="translate(150, 60)">
    <text x="0" y="25" fill="#a5b4fc" font-family="Georgia, serif" font-weight="bold" font-size="14">VOLUME III</text>
    <text x="0" y="55" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="20">Advanced Composition</text>
    <text x="0" y="80" fill="#e0e7ff" font-family="Georgia, serif" font-size="13">Rhetoric, essays &amp; comprehension</text>

    <!-- Badge -->
    <rect x="0" y="105" width="110" height="26" rx="13" fill="#ffffff" opacity="0.15"/>
    <text x="55" y="122" fill="#a5b4fc" font-family="Georgia, serif" font-weight="bold" font-size="11" text-anchor="middle">10 Chapters</text>
  </g>

  <!-- Floating Letters Artwork -->
  <g fill="#a5b4fc" opacity="0.15" font-family="Georgia, serif" font-weight="bold">
    <text x="320" y="70" font-size="48">✒️</text>
    <text x="330" y="190" font-size="42">✍️</text>
  </g>
</svg>

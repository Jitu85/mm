<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#4a0012"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg1)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="600" fill="url(#grid)"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="150" r="120" fill="#a855f7" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="160" fill="#eab308" opacity="0.2" filter="url(#glow)"/>

  <!-- Floating Grammar Symbols -->
  <g opacity="0.3" fill="url(#gold)" font-family="Georgia, serif" font-weight="bold">
    <text x="150" y="120" font-size="72" filter="url(#glow)">Aa</text>
    <text x="950" y="180" font-size="80" filter="url(#glow)">&ldquo;&rdquo;</text>
    <text x="100" y="480" font-size="64" filter="url(#glow)">Bb</text>
    <text x="1050" y="520" font-size="70" filter="url(#glow)">?!</text>
    <text x="580" y="100" font-size="50" filter="url(#glow)">Cc</text>
  </g>

  <!-- Central Graphic: Vintage Open Book -->
  <g transform="translate(450, 220)">
    <!-- Shadow -->
    <ellipse cx="150" cy="220" rx="220" ry="25" fill="#000000" opacity="0.4" filter="url(#glow)"/>

    <!-- Left Book Cover -->
    <path d="M 0 200 C 60 190 120 205 150 215 L 150 15 C 120 5 60 -10 0 0 Z" fill="url(#bookCover)"/>
    <!-- Right Book Cover -->
    <path d="M 300 200 C 240 190 180 205 150 215 L 150 15 C 180 5 240 -10 300 0 Z" fill="url(#bookCover)"/>

    <!-- Left Pages -->
    <path d="M 10 190 C 65 180 125 195 148 205 L 148 20 C 125 10 65 -5 10 5 Z" fill="url(#paper)"/>
    <path d="M 15 185 C 68 176 126 190 146 200 L 146 23 C 126 14 68 0 15 8 Z" fill="#fffbeb" opacity="0.8"/>

    <!-- Right Pages -->
    <path d="M 290 190 C 235 180 175 195 152 205 L 152 20 C 175 10 235 -5 290 5 Z" fill="url(#paper)"/>
    <path d="M 285 185 C 232 176 174 190 154 200 L 154 23 C 174 14 232 0 285 8 Z" fill="#fffbeb" opacity="0.8"/>

    <!-- Spine Divider -->
    <line x1="150" y1="15" x2="150" y2="210" stroke="#ca8a04" stroke-width="4"/>

    <!-- Text Lines on Pages -->
    <g stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <!-- Left page lines -->
      <line x1="35" y1="45" x2="125" y2="40"/>
      <line x1="35" y1="65" x2="125" y2="60"/>
      <line x1="35" y1="85" x2="125" y2="80"/>
      <line x1="35" y1="105" x2="125" y2="100"/>
      <line x1="35" y1="125" x2="125" y2="120"/>
      <line x1="35" y1="145" x2="125" y2="140"/>

      <!-- Right page lines -->
      <line x1="175" y1="40" x2="265" y2="45"/>
      <line x1="175" y1="60" x2="265" y2="65"/>
      <line x1="175" y1="80" x2="265" y2="85"/>
      <line x1="175" y1="100" x2="265" y2="105"/>
      <line x1="175" y1="120" x2="265" y2="125"/>
      <line x1="175" y1="140" x2="265" y2="145"/>
    </g>

    <!-- Golden Magic Sparkles -->
    <g fill="url(#gold)" filter="url(#glow)">
      <polygon points="150,-20 154,-10 165,-10 156,-2 159,10 150,2 141,10 144,-2 135,-10 146,-10"/>
      <polygon points="80,-40 83,-32 92,-32 85,-26 87,-18 80,-23 73,-18 75,-26 68,-32 77,-32"/>
      <polygon points="220,-35 223,-27 232,-27 225,-21 227,-13 220,-18 213,-13 215,-21 208,-27 217,-27"/>
    </g>
  </g>
</svg>

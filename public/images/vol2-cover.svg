<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="v2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="v2Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="v2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#v2Bg)"/>
  <rect x="12" y="12" width="376" height="216" rx="12" fill="none" stroke="url(#v2Gold)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Volume Badge Icon -->
  <g transform="translate(40, 45)" filter="url(#v2Shadow)">
    <circle cx="45" cy="45" r="40" fill="url(#v2Gold)"/>
    <text x="45" y="58" fill="#451a03" font-family="Georgia, serif" font-weight="bold" font-size="38" text-anchor="middle">II</text>
  </g>

  <!-- Text Details -->
  <g transform="translate(150, 60)">
    <text x="0" y="25" fill="#fef08a" font-family="Georgia, serif" font-weight="bold" font-size="14">VOLUME II</text>
    <text x="0" y="55" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="20">Tenses &amp; Sentence Structure</text>
    <text x="0" y="80" fill="#fef3c7" font-family="Georgia, serif" font-size="13">Verb tenses, clauses &amp; voice</text>

    <!-- Badge -->
    <rect x="0" y="105" width="110" height="26" rx="13" fill="#ffffff" opacity="0.15"/>
    <text x="55" y="122" fill="#fef08a" font-family="Georgia, serif" font-weight="bold" font-size="11" text-anchor="middle">7 Chapters</text>
  </g>

  <!-- Floating Letters Artwork -->
  <g fill="#fef08a" opacity="0.15" font-family="Georgia, serif" font-weight="bold">
    <text x="310" y="75" font-size="48">&ldquo;&rdquo;</text>
    <text x="330" y="190" font-size="42">Cc</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg4)"/>

  <!-- Orbs -->
  <circle cx="350" cy="220" r="160" fill="#f59e0b" opacity="0.3" filter="url(#glow4)"/>
  <circle cx="850" cy="380" r="170" fill="#ef4444" opacity="0.25" filter="url(#glow4)"/>

  <!-- Golden Trophy Centerpiece -->
  <g transform="translate(600, 260)" filter="url(#glow4)">
    <!-- Base -->
    <rect x="-80" y="140" width="160" height="30" rx="6" fill="#78350f"/>
    <rect x="-60" y="110" width="120" height="30" fill="url(#gold4)"/>

    <!-- Stem -->
    <path d="M -25 50 L -20 110 L 20 110 L 25 50 Z" fill="url(#gold4)"/>

    <!-- Cup Body -->
    <path d="M -90 -80 C -90 40 90 40 90 -80 Z" fill="url(#gold4)"/>
    <ellipse cx="0" cy="-80" rx="90" ry="25" fill="#fef08a"/>

    <!-- Handles -->
    <path d="M -90 -50 C -150 -50 -130 10 -80 0" stroke="url(#gold4)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 90 -50 C 150 -50 130 10 80 0" stroke="url(#gold4)" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Star Emblem -->
    <polygon points="0,-40 8,-20 30,-20 12,-8 18,14 0,0 -18,14 -12,-8 -30,-20 -8,-20" fill="#ffffff"/>
  </g>

  <!-- Floating Speed Lightning & Star Badges -->
  <g fill="url(#gold4)" opacity="0.4" font-family="sans-serif">
    <text x="180" y="200" font-size="90">⚡</text>
    <text x="960" y="220" font-size="80">🔥</text>
    <text x="160" y="480" font-size="80">⏱️</text>
    <text x="940" y="480" font-size="85">🌟</text>
  </g>
</svg>

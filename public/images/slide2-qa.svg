<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg2)"/>

  <!-- Orbs -->
  <circle cx="250" cy="180" r="140" fill="#10b981" opacity="0.3" filter="url(#shadow)"/>
  <circle cx="950" cy="420" r="170" fill="#f59e0b" opacity="0.25" filter="url(#shadow)"/>

  <!-- Floating Q & A Math & Tech Icons -->
  <g opacity="0.25" fill="#ffffff" font-family="sans-serif" font-weight="bold">
    <text x="120" y="160" font-size="80">?</text>
    <text x="1000" y="200" font-size="90">✓</text>
    <text x="150" y="500" font-size="70">∑</text>
    <text x="980" y="500" font-size="80">π</text>
    <text x="560" y="120" font-size="60">&amp;</text>
  </g>

  <!-- Interactive Quiz Card Representation -->
  <g transform="translate(380, 160)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="440" height="280" rx="20" fill="url(#cardGrad)" stroke="#d97706" stroke-width="4"/>

    <!-- Top Badge -->
    <rect x="30" y="-18" width="160" height="36" rx="18" fill="#800020"/>
    <text x="110" y="5" fill="#fde047" font-family="serif" font-weight="bold" font-size="14" text-anchor="middle">
      QUESTIONS &amp; ANSWERS
    </text>

    <!-- Question Line -->
    <text x="40" y="65" fill="#581c87" font-family="serif" font-weight="bold" font-size="20">
      What enables computers to mimic AI?
    </text>

    <!-- Option A -->
    <rect x="40" y="100" width="360" height="38" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
    <circle cx="65" cy="119" r="11" fill="#9ca3af"/>
    <text x="65" y="123" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">A</text>
    <text x="90" y="124" fill="#374151" font-family="sans-serif" font-size="14">Cloud Computing</text>

    <!-- Option B (Selected / Correct) -->
    <rect x="40" y="150" width="360" height="38" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
    <circle cx="65" cy="169" r="11" fill="#065f46"/>
    <text x="65" y="173" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">B</text>
    <text x="90" y="174" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Artificial Intelligence</text>
    <text x="375" y="174" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">✓</text>

    <!-- Option C -->
    <rect x="40" y="200" width="360" height="38" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
    <circle cx="65" cy="219" r="11" fill="#9ca3af"/>
    <text x="65" y="223" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">C</text>
    <text x="90" y="224" fill="#374151" font-family="sans-serif" font-size="14">Web Development</text>
  </g>

  <!-- Floating Glowing Medals / Sparkles -->
  <g transform="translate(260, 320)" filter="url(#shadow)">
    <circle cx="40" cy="40" r="35" fill="url(#gold)"/>
    <text x="40" y="47" font-size="28" text-anchor="middle">🏆</text>
  </g>
  <g transform="translate(860, 240)" filter="url(#shadow)">
    <circle cx="35" cy="35" r="30" fill="#3b82f6"/>
    <text x="35" y="42" font-size="24" text-anchor="middle">⚡</text>
  </g>
</svg>

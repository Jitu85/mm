<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg5)"/>

  <!-- Orbs -->
  <circle cx="300" cy="220" r="160" fill="#6366f1" opacity="0.3" filter="url(#glow5)"/>
  <circle cx="900" cy="380" r="170" fill="#10b981" opacity="0.25" filter="url(#glow5)"/>

  <!-- Ascending Analytics Bar Chart Graphic -->
  <g transform="translate(380, 160)" filter="url(#glow5)">
    <!-- Chart Background Board -->
    <rect width="440" height="280" rx="20" fill="#1e1b4b" opacity="0.8" stroke="#6366f1" stroke-width="3"/>

    <!-- Grid Lines -->
    <line x1="40" y1="60" x2="400" y2="60" stroke="#475569" stroke-dasharray="4"/>
    <line x1="40" y1="120" x2="400" y2="120" stroke="#475569" stroke-dasharray="4"/>
    <line x1="40" y1="180" x2="400" y2="180" stroke="#475569" stroke-dasharray="4"/>
    <line x1="40" y1="240" x2="400" y2="240" stroke="#475569"/>

    <!-- Bar 1 -->
    <rect x="70" y="160" width="50" height="80" rx="8" fill="url(#barGrad)"/>
    <text x="95" y="150" fill="#a5b4fc" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">55%</text>

    <!-- Bar 2 -->
    <rect x="150" y="120" width="50" height="120" rx="8" fill="url(#barGrad)"/>
    <text x="175" y="110" fill="#a5b4fc" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">70%</text>

    <!-- Bar 3 -->
    <rect x="230" y="80" width="50" height="160" rx="8" fill="url(#barGrad)"/>
    <text x="255" y="70" fill="#a5b4fc" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">85%</text>

    <!-- Bar 4 (Peak) -->
    <rect x="310" y="40" width="50" height="200" rx="8" fill="url(#gold5)"/>
    <text x="335" y="30" fill="#fde047" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">98%</text>

    <!-- Ascending Trend Line -->
    <path d="M 95 160 L 175 120 L 255 80 L 335 40" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="335" cy="40" r="8" fill="#ffffff"/>
  </g>

  <!-- Floating Achievement Icons -->
  <g fill="url(#gold5)" opacity="0.35" font-family="sans-serif">
    <text x="150" y="180" font-size="80">📈</text>
    <text x="980" y="200" font-size="80">🎯</text>
    <text x="140" y="480" font-size="85">🎓</text>
    <text x="960" y="480" font-size="80">🏅</text>
  </g>
</svg>
